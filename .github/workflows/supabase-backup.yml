name: Weekly Supabase Backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c \
            -f "trado_backup_$(date +%Y-%m-%d).dump"

      - name: Upload backup as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trado-db-backup-${{ github.run_id }}
          path: trado_backup_*.dump
          retention-days: 90
