name: Weekly Supabase Backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -v "$PWD":/backup -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f /backup/trado_backup_$(date +%Y-%m-%d).dump'

      - name: Upload backup as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trado-db-backup-${{ github.run_id }}
          path: trado_backup_*.dump
          retention-days: 90
