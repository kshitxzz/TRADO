name: Update market data

# Keeps frontend/public/market-data current without you doing anything.
#  - Runs on the 4th of every month at 06:00 UTC (Dukascopy needs about 2 days to settle a finished month).
#  - Can also be started by hand: Actions tab -> "Update market data" -> "Run workflow".
# It downloads only what is new, verifies every file, and commits + pushes to main only if something changed.
# The push makes Cloudflare redeploy the site with the new data.
# If a run fails you get GitHub's failure email, and nothing is committed.

on:
  schedule:
    - cron: '0 6 4 * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols (leave empty to use the list in this file)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

env:
  # Edit this list when you add symbols. Supported: EURUSD GBPUSD USDJPY USDCHF USDCAD AUDUSD NZDUSD EURGBP EURJPY GBPJPY
  # EURAUD GBPAUD AUDJPY XAUUSD XAGUSD WTIUSD BRENTUSD NATGAS
  SYMBOLS: XAUUSD,EURUSD,GBPUSD,USDJPY
  FROM: '2024-01'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/data-store/package-lock.json

      - name: Install the downloader
        working-directory: tools/data-store
        run: npm ci

      # Dukascopy protects its free feed with a bot check, so the downloader needs a headless browser.
      - name: Install browser
        working-directory: tools/data-store
        run: npx dukascopy-node --install-browser --with-deps

      - name: Download new data
        working-directory: tools/data-store
        env:
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
        run: node ingest.mjs --symbols "${INPUT_SYMBOLS:-$SYMBOLS}" --from "$FROM" --out ../../frontend/public/market-data

      - name: Verify every file against the manifest
        working-directory: tools/data-store
        run: node ingest.mjs --check --out ../../frontend/public/market-data

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/market-data
          if git diff --cached --quiet; then
            echo "No new market data."
            exit 0
          fi
          git commit -m "Update market data ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
